<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Tangzhong Lab — One dough, two directions</title>
<desc id="desc">A branded visual with the artisan bread and pizza modes alongside the reference formula, 697 grams of dough, 400 grams of flour, and 71.5 percent hydration.</desc>
